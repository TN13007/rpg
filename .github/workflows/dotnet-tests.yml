name: .NET Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run complete repository validation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          ARGS=(--base "$BASE_REF" --head "$HEAD_REF" --branch "$BRANCH_NAME")
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            ARGS+=(--check-branch)
          fi
          python3 Tools/Validate.py "${ARGS[@]}"

      - name: Install Godot 4.7.2 .NET
        shell: bash
        run: |
          set -euo pipefail
          GODOT_ARCHIVE="Godot_v4.7.2-stable_mono_linux_x86_64.zip"
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/${GODOT_ARCHIVE}"
          curl --fail --location --silent --show-error "${GODOT_URL}" --output /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' -print -quit)"
          if [[ -z "${GODOT_BIN}" ]]; then
            echo "Godot 4.7.2 .NET executable was not found in the release archive."
            exit 1
          fi
          chmod +x "${GODOT_BIN}"
          echo "GODOT_BIN=${GODOT_BIN}" >> "${GITHUB_ENV}"

      - name: Build Debug C# assembly for Godot runtime
        run: dotnet build RPG.csproj --configuration Debug

      - name: Run Godot 4.7.2 .NET scene smoke tests
        shell: bash
        run: |
          set -euo pipefail
          run_godot_check() {
            local check_name="$1"
            shift
            local log_file="/tmp/godot-${check_name}.log"
            "${GODOT_BIN}" "$@" 2>&1 | tee "${log_file}"
            if grep -E 'ERROR:|SCRIPT ERROR:' "${log_file}"; then
              echo "Godot ${check_name} check reported an engine or script error."
              exit 1
            fi
          }

          run_godot_check import --headless --editor --path . --quit
          run_godot_check main-scene --headless --path . --quit-after 120
          run_godot_check combat-preview --headless --path . --scene res://Scenes/Previews/CombatPreview.tscn --quit-after 120

      - name: Enforce full repository naming audit
        shell: bash
        run: python3 Tools/CheckProjectNaming.py --audit-all
